<form class="eci-settings">
  <section class="eci-block">
    <h2 class="eci-title">{{localize "foundry-mcp-bridge.eci.title"}}</h2>
    <p class="eci-note">
      {{localize "foundry-mcp-bridge.eci.description"}}
    </p>
  </section>

  <hr class="eci-divider"/>

  <section class="eci-block">
    <h3 class="eci-subtitle">{{localize "foundry-mcp-bridge.eci.manualRebuild"}}</h3>
    <p class="eci-hint">
      {{localize "foundry-mcp-bridge.eci.manualRebuildHint"}}
    </p>
    <button type="button" class="eci-btn rebuild-index-btn" data-action="rebuild">
      {{localize "foundry-mcp-bridge.eci.rebuildIndex"}}
    </button>
  </section>

  <hr class="eci-divider"/>

  <section class="eci-block eci-settings-block">
    <h3 class="eci-subtitle">{{localize "foundry-mcp-bridge.eci.settings"}}</h3>
    <label class="eci-check">
      <input type="checkbox" name="enableEnhancedCreatureIndex" {{#if enableEnhancedCreatureIndex}}checked{{/if}} />
      <span>
        <strong>{{localize "foundry-mcp-bridge.eci.enable"}}</strong> — {{localize "foundry-mcp-bridge.eci.enableHint"}}
      </span>
    </label>

    <label class="eci-check">
      <input type="checkbox" name="autoRebuildIndex" {{#if autoRebuildIndex}}checked{{/if}} />
      <span>
        <strong>{{localize "foundry-mcp-bridge.eci.autoRebuild"}}</strong> — {{localize "foundry-mcp-bridge.eci.autoRebuildHint"}}
      </span>
    </label>
  </section>

  <div class="form-footer">
    <button type="submit" class="eci-btn"><i class="fas fa-save"></i> {{localize "foundry-mcp-bridge.eci.saveSettings"}}</button>
  </div>
</form>
